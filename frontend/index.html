<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WindCore — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="logo">
        <div class="logo-icon">💨</div>
        <h1>WindCore</h1>
      </div>
      <p>Wind turbine power prediction system</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="text" id="email" placeholder="you@example.com" autocomplete="username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" onclick="login()">Sign in</button>

    <p id="loginErr" class="error-msg"></p>
    <p class="login-note">Demo: any email + password works</p>

  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
